[project]
name = "job-hunter"
version = "0.1.0"
description = "Cross-platform job search and monitoring application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "PySide6>=6.7",
    "pytest-asyncio>=0.24",
    "notify-py>=0.3.43",
    "qasync>=0.27",
    "pyinstaller>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
job-hunter = "app.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"